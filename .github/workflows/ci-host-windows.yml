---
# Builds and tests the Sunshine-derived host on Windows (AMD64), following upstream's ci-windows.yml
# (host/.github/workflows/ci-windows.yml) minus packaging, signing and coverage.
name: host (Windows)
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - 'host-helpers/common/**'
      - 'protocol/**'
      - 'drivers/vdd/include/**'
      - 'cmake/**'
      - '.gitmodules'
      - '.github/workflows/ci-host-windows.yml'
  pull_request:
    paths:
      - 'host/**'
      - 'host-helpers/common/**'
      - 'protocol/**'
      - 'drivers/vdd/include/**'
      - 'cmake/**'
      - '.gitmodules'
      - '.github/workflows/ci-host-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'

jobs:
  build:
    name: Windows-AMD64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch host submodules
        shell: bash
        # build-deps is only used to find the matching prebuilt FFmpeg release, so its nested
        # FFmpeg/x264/x265/... sources (several GB) are not needed on Windows.
        run: |
          git submodule update --init --depth 1 --jobs 8 -- host
          git submodule foreach --quiet '
            case "$sm_path" in
              host/third-party/build-deps) ;;
              host/*) git submodule update --init --recursive --depth 1 --jobs 8 ;;
            esac'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-doxygen
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-graphviz
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-qt6-static
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nsis

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      - name: NodeJS Path
        shell: pwsh
        run: |
          $NODEJS_PATH = Split-Path -Path (Get-Command node).Source -Parent
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: host/uv.lock

      - name: Sync Python tools
        working-directory: host
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv sync --locked --no-python-downloads --no-install-project

      - name: Build
        working-directory: host
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_WERROR=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${GITHUB_REPOSITORY_OWNER}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${GITHUB_REPOSITORY}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${GITHUB_REPOSITORY}/issues"
          ninja -C build

      - name: Run tests
        working-directory: host/build/tests
        run: ./test_sunshine.exe --gtest_color=yes --gtest_output=xml:test_results.xml

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: host-windows-amd64
          retention-days: 7
          if-no-files-found: ignore
          # assets: shaders and the web UI, which sunshine.exe needs next to it (Phase 2 test harness)
          path: |
            host/build/sunshine.exe
            host/build/tools/*.exe
            host/build/assets/**
            host/build/tests/test_results.xml
