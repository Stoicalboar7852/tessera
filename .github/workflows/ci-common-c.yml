---
# Builds the shared client protocol library (moonlight-common-c fork) on the three desktop platforms, and runs the
# tests for Tessera's additions (common-c/tests).
name: common-c
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'common-c/**'
      - 'protocol/**'
      - '.gitmodules'
      - '.github/workflows/ci-common-c.yml'
  pull_request:
    paths:
      - 'common-c/**'
      - 'protocol/**'
      - '.gitmodules'
      - '.github/workflows/ci-common-c.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fetch submodules
        run: git submodule update --init --recursive --depth 1 -- common-c
      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ninja-build
      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 ninja
      - name: Configure
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"; fi
          cmake -S common-c -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $extra
          cmake -S common-c/tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release $extra
      - name: Build
        run: |
          cmake --build build
          cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fetch submodules
        shell: bash
        run: git submodule update --init --recursive --depth 1 -- common-c
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ucrt64
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
      - name: Configure
        run: |
          cmake -S common-c -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake -S common-c/tests -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build
          cmake --build build-tests
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure
