---
# Builds the Qt client for Windows x64 and macOS, following upstream's build-win-mac.yml
# (clients/qt/.github/workflows/build-win-mac.yml) without ARM64 and signing.
name: client Qt (Windows, macOS)
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'clients/qt/**'
      - '.gitmodules'
      - '.github/workflows/ci-client-qt.yml'
  pull_request:
    paths:
      - 'clients/qt/**'
      - '.gitmodules'
      - '.github/workflows/ci-client-qt.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            qt_version: 6.12.0
          - os: macos-26
            qt_version: 6.11.2
    runs-on: ${{ matrix.os }}
    env:
      CI_VERSION: 0.0.0-ci.${{ github.run_number }}
    defaults:
      run:
        working-directory: clients/qt
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch submodules
        working-directory: .
        shell: bash
        run: git submodule update --init --recursive --depth 1 -- clients/qt

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        run: powershell ./setup-deps.ps1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build x64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_64\bin

      - name: Build package (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/generate-dmg.sh Release

      - name: Upload binaries (Windows x64)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: client-qt-windows-x64
          retention-days: 7
          path: clients/qt/build/deploy-x64-release/*
          if-no-files-found: error

      - name: Upload binaries (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: client-qt-macos
          retention-days: 7
          path: clients/qt/build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error
